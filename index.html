<script>const DATA={"nodes": [{"id": "5", "title": "Database foundation", "group": "Core", "deps": [], "proposed": false, "description": "Establishes the database schema for the three primary functional modules and auditing tables.", "story": "As a system administrator, I want to use database foundation so that establishes the database schema for the three primary functional modules and auditing tables.", "criteria": ["PostgreSQL database initialized with schema migrations managed via Flyway/Liquibase. Enforces strict relational foreign key constraints, column validations, unique indexes, and audit timestamps (created_at, updated_at, created_by, updated_by).", "users, roles, permissions, students, guardians, vouchers, requirements, sections, academic_terms, grades, grade_corrections, withdrawals, audit_logs."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "6", "title": "Authentication & JWT", "group": "Core", "deps": ["5"], "proposed": false, "description": "Secure login mechanism for school personnel to authenticate into the system.", "story": "As a system administrator, I want to use authentication & jwt so that secure login mechanism for school personnel to authenticate into the system.", "criteria": ["Java Spring Boot using Spring Security and jjwt. Endpoint /api/auth/login accepts credentials, verifies BCrypt hashes, and issues signed stateless JSON Web Tokens (JWT) containing user ID, campus scope, and role claims. Includes a token invalidation endpoint (/api/auth/logout)."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "7", "title": "Role-based access control", "group": "Core", "deps": ["6"], "proposed": false, "description": "Access restriction ensuring users view and operate only functions authorized for their role.", "story": "As a system administrator, I want to use role-based access control so that access restriction ensuring users view and operate only functions authorized for their role.", "criteria": ["Declarative method-level security (@PreAuthorize(\"hasRole('...')\")) on Spring Boot controllers alongside React client-side route guards.", "Full system administrative and account control.", "Master record creation, requirement auditing, section assignment, grade period lock, and document issuance.", "System-wide academic oversight, operational report generation, and withdrawal approvals.", "Read-only access to assigned advisory section, student compliance badges, and withdrawal endorsement.", "Grade submission for assigned subjects during active submission windows and correction request submission."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "8", "title": "React shell & design system", "group": "Core", "deps": [], "proposed": false, "description": "Single-page interface layout reflecting ICI brand design standards.", "story": "As a system administrator, I want to use react shell & design system so that single-page interface layout reflecting ICI brand design standards.", "criteria": ["React interface implementing responsive navigation, collapsible sidebars, breadcrumbs, modal dialogs, and toast notifications. Configured with brand design tokens: Primary Blue (#56A9C8), Deep Slate Blue (#6A8FB4), Soft Coral (#D97A84), Mint Green (#7FC9B3), Charcoal (#2F3136), and Mist White (#F7F9FB)."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "9", "title": "User account panel", "group": "Core", "deps": ["7", "8"], "proposed": false, "description": "Administrators can create, edit, activate and deactivate school personnel accounts.", "story": "As a system administrator, I want to use user account panel so that administrators can create, edit, activate and deactivate school personnel accounts.", "criteria": ["Create accounts with authorized role and campus scope.", "Reject unauthorized account changes.", "Deactivated accounts cannot authenticate."], "source": "Additional planning task \u2014 team review required."}, {"id": "12", "title": "Student master record API", "group": "Enrollment", "deps": ["5"], "proposed": false, "description": "Ingestion and management of incoming applicant demographic, family, and educational details.", "story": "As a registrar, I want to use student master record api so that ingestion and management of incoming applicant demographic, family, and educational details.", "criteria": ["Form submission and Spring Boot REST API persisting personal details, Learner Reference Number (LRN), junior high origin, parental information, household income bracket, track, and specialization (STEM, ABM, HUMSS, TVL-Cookery, etc.).", "Classifies applicants as Qualified Voucher Recipient (QVR), Education Service Contracting (ESC), Alternative Learning System (ALS), or Regular/Paying."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "13", "title": "Duplicate applicant detection", "group": "Enrollment", "deps": ["12"], "proposed": false, "description": "Automatic validation preventing duplicate applicant records across campuses.", "story": "As a registrar, I want to use duplicate applicant detection so that automatic validation preventing duplicate applicant records across campuses.", "criteria": ["Spring Boot service running SQL validation checks when an applicant is submitted. Flags matches based on exact LRN matches or fuzzy matches on normalized full name plus date of birth.", "Suspected duplicates trigger a DUPLICATE_FLAG state, placing the file into a dedicated Registrar resolution queue with side-by-side comparison tools to merge or reject records."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "14", "title": "Enrollment queue & intake", "group": "Enrollment", "deps": ["12", "13", "8"], "proposed": false, "description": "Ingestion and management of incoming applicant demographic, family, and educational details.", "story": "As a registrar, I want to use enrollment queue & intake so that ingestion and management of incoming applicant demographic, family, and educational details.", "criteria": ["Form submission and Spring Boot REST API persisting personal details, Learner Reference Number (LRN), junior high origin, parental information, household income bracket, track, and specialization (STEM, ABM, HUMSS, TVL-Cookery, etc.).", "Classifies applicants as Qualified Voucher Recipient (QVR), Education Service Contracting (ESC), Alternative Learning System (ALS), or Regular/Paying."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "15", "title": "Requirement checklist service", "group": "Enrollment", "deps": ["12"], "proposed": false, "description": "Digital tracking system replacing paper-based and Excel document trackers.", "story": "As a registrar, I want to use requirement checklist service so that digital tracking system replacing paper-based and Excel document trackers.", "criteria": ["Relational document checklist recording submission state per mandatory credential: PSA Birth Certificate, Form 137/Report Card, Certificate of Completion, and Certificate of Good Moral Character.", "Submitted, Missing, Pending, and Invalid. The engine dynamically evaluates the aggregate state (Complete, Incomplete, Pending) and creates an immutable audit row whenever a document status changes."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "16", "title": "Requirement verification screen", "group": "Enrollment", "deps": ["15", "8"], "proposed": false, "description": "Digital tracking system replacing paper-based and Excel document trackers.", "story": "As a registrar, I want to use requirement verification screen so that digital tracking system replacing paper-based and Excel document trackers.", "criteria": ["Relational document checklist recording submission state per mandatory credential: PSA Birth Certificate, Form 137/Report Card, Certificate of Completion, and Certificate of Good Moral Character.", "Submitted, Missing, Pending, and Invalid. The engine dynamically evaluates the aggregate state (Complete, Incomplete, Pending) and creates an immutable audit row whenever a document status changes."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "17", "title": "Attendance & enrollment confirmation", "group": "Enrollment", "deps": ["15"], "proposed": false, "description": "Business workflow transitioning students from provisional applicants to officially confirmed students.", "story": "As a registrar, I want to use attendance & enrollment confirmation so that business workflow transitioning students from provisional applicants to officially confirmed students.", "criteria": ["Multi-point gatekeeper API. Checks document completion and verifies first-week orientation attendance flag before updating a student record status from Pre-Enlisted to Enrolled. Prevents premature record generation for non-attending walk-ins."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "18", "title": "Section configuration API", "group": "Enrollment", "deps": ["5"], "proposed": false, "description": "Balanced student distribution across sections based on physical constraints and routing rules.", "story": "As a registrar, I want to use section configuration api so that balanced student distribution across sections based on physical constraints and routing rules.", "criteria": ["Database model defining section entities with attributes for campus, academic year, grade level, track, strand, physical classroom room assignment, and maximum capacity limit.", "React interface displaying real-time filled/available seat meters. Filters students by residential district/transportation route and program. Enforces concurrency checks to prevent section over-allocation."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "19", "title": "Section allocation workspace", "group": "Enrollment", "deps": ["18", "12", "8"], "proposed": false, "description": "Balanced student distribution across sections based on physical constraints and routing rules.", "story": "As a registrar, I want to use section allocation workspace so that balanced student distribution across sections based on physical constraints and routing rules.", "criteria": ["Database model defining section entities with attributes for campus, academic year, grade level, track, strand, physical classroom room assignment, and maximum capacity limit.", "React interface displaying real-time filled/available seat meters. Filters students by residential district/transportation route and program. Enforces concurrency checks to prevent section over-allocation."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "SETUP", "title": "Subjects, years & grading periods", "group": "Academic", "deps": ["5"], "proposed": true, "description": "Configure subjects, academic years, terms and grading periods.", "story": "As a registrar or assigned teacher, I want to use subjects, years & grading periods so that configure subjects, academic years, terms and grading periods.", "criteria": ["Reject duplicate subject codes and invalid dates.", "Assignments and grades reference configured subjects and periods.", "Protect referenced records from destructive deletion."], "source": "Additional planning task \u2014 team review required."}, {"id": "41", "title": "Teacher & adviser assignments", "group": "Academic", "deps": ["18", "7", "SETUP"], "proposed": false, "description": "Assign teachers to subjects/classes and advisers to sections for an academic year.", "story": "As a registrar or assigned teacher, I want to use teacher & adviser assignments so that assign teachers to subjects/classes and advisers to sections for an academic year.", "criteria": ["Teachers can access only their assigned classes.", "Advisory rosters resolve the assigned section.", "Withdrawal endorsements route to the assigned adviser."], "source": "Additional planning task \u2014 team review required."}, {"id": "GRADE", "title": "Grade draft & submission API", "group": "Academic", "deps": ["41", "SETUP"], "proposed": true, "description": "Persist grade drafts and formal submissions with assignment authorization and audit history.", "story": "As a registrar or assigned teacher, I want to use grade draft & submission api so that persist grade drafts and formal submissions with assignment authorization and audit history.", "criteria": ["Save and retrieve draft marks including INC where allowed.", "Validate grade scales and teacher assignments.", "Reject writes during locked periods after lock-service integration."], "source": "Additional planning task \u2014 team review required."}, {"id": "23", "title": "Advisory section roster", "group": "Academic", "deps": ["19", "15", "17", "41"], "proposed": false, "description": "Read-only monitoring screen dedicated to Teacher Advisers.", "story": "As a registrar or assigned teacher, I want to use advisory section roster so that read-only monitoring screen dedicated to Teacher Advisers.", "criteria": ["React dashboard connected to Spring Boot endpoint querying by teacher ID and active academic year. Displays section students, contact numbers, enrollment states, credential completion badges, and academic flags without allowing unauthorized record edits."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "24", "title": "Subject grade encoding grid", "group": "Academic", "deps": ["19", "41", "GRADE"], "proposed": false, "description": "Spreadsheet-like web interface for subject teachers to encode grading period marks.", "story": "As a registrar or assigned teacher, I want to use subject grade encoding grid so that spreadsheet-like web interface for subject teachers to encode grading period marks.", "criteria": ["Data-entry grid supporting keyboard navigation, cell-level numeric validation (0.00 to 100.00 or DepEd non-numeric scales), autosaving drafts, and formal submission controls. Ensures teachers only access classes explicitly assigned to them."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "25", "title": "Grading period finalization & locks", "group": "Academic", "deps": ["24", "SETUP"], "proposed": false, "description": "Automated and manual cutoffs preventing unauthorized grade adjustments past deadlines.", "story": "As a registrar or assigned teacher, I want to use grading period finalization & locks so that automated and manual cutoffs preventing unauthorized grade adjustments past deadlines.", "criteria": ["Administrative control module allowing the Registrar to set submission deadlines or manually trigger immediate grade locks per grading period, grade level, and section. Post-lock write operations via teacher endpoints are rejected with HTTP 403 Forbidden."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "26", "title": "Grade correction requests", "group": "Academic", "deps": ["25"], "proposed": false, "description": "Digital post-lock grade revision cycle replacing paper letters and informal notifications.", "story": "As a registrar or assigned teacher, I want to use grade correction requests so that digital post-lock grade revision cycle replacing paper letters and informal notifications.", "criteria": ["Technical Implementation Steps:", "Teacher submits an electronic request specifying student ID, subject, original grade, proposed revised grade, and mandatory justification.", "Teacher uploads supporting proof (scanned assessment or computation sheet) handled via Spring Boot multipart storage.", "Registrar reviews request in an adjudication queue, issuing an Approval or Rejection.", "System executes the grade change within a database transaction and logs old value, new value, timestamp, teacher ID, and approving registrar ID into the audit log."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "27", "title": "Grade correction review & approval", "group": "Academic", "deps": ["26"], "proposed": false, "description": "Digital post-lock grade revision cycle replacing paper letters and informal notifications.", "story": "As a registrar or assigned teacher, I want to use grade correction review & approval so that digital post-lock grade revision cycle replacing paper letters and informal notifications.", "criteria": ["Technical Implementation Steps:", "Teacher submits an electronic request specifying student ID, subject, original grade, proposed revised grade, and mandatory justification.", "Teacher uploads supporting proof (scanned assessment or computation sheet) handled via Spring Boot multipart storage.", "Registrar reviews request in an adjudication queue, issuing an Approval or Rejection.", "System executes the grade change within a database transaction and logs old value, new value, timestamp, teacher ID, and approving registrar ID into the audit log."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "28", "title": "Incomplete grade monitoring", "group": "Academic", "deps": ["24"], "proposed": false, "description": "Monitoring tool to surface, resolve, and close outstanding incomplete marks (INC).", "story": "As a registrar or assigned teacher, I want to use incomplete grade monitoring so that monitoring tool to surface, resolve, and close outstanding incomplete marks (INC).", "criteria": ["Database view aggregating all unresolved INC grades across historical and active terms. Allows registrar staff to track pending completion tasks, record follow-up logs with subject teachers, and update finalized marks upon completion."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "29", "title": "Consolidated academic history", "group": "Academic", "deps": ["24", "15", "19"], "proposed": false, "description": "Comprehensive single-screen timeline displaying a student's complete academic path.", "story": "As a registrar or assigned teacher, I want to use consolidated academic history so that comprehensive single-screen timeline displaying a student's complete academic path.", "criteria": ["Aggregated React view retrieving all completed terms, subjects, quarterly marks, final ratings, section assignments, adviser history, and document checklist statuses for a given student ID. Includes a single-click PDF export function."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "30", "title": "Withdrawal clearance workflow", "group": "Academic", "deps": ["12", "41"], "proposed": false, "description": "End-to-end clearance pipeline managing student departures and credential withholding.", "story": "As a registrar or assigned teacher, I want to use withdrawal clearance workflow so that end-to-end clearance pipeline managing student departures and credential withholding.", "criteria": ["Mandatory Verification Steps:", "Teacher adviser endorsement.", "Cashiering office financial clearance confirmation.", "Locks official credential release until all clearances are checked, automatically updating student standing to Withdrawn."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "31", "title": "Dynamic report query engine", "group": "Reporting", "deps": ["12", "18"], "proposed": false, "description": "Modular data filtering engine powering operational summaries.", "story": "As a authorized school staff member, I want to use dynamic report query engine so that modular data filtering engine powering operational summaries.", "criteria": ["Spring Boot service utilizing JPA Criteria API and native queries to aggregate data dynamically across five dimensions: Campus, Academic Year, Grading Period, Grade Level, and Section."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "32", "title": "Operational reports & exports", "group": "Reporting", "deps": ["31", "15", "17"], "proposed": false, "description": "Exportable institutional reports for administration and DepEd monitoring.", "story": "As a authorized school staff member, I want to use operational reports & exports so that exportable institutional reports for administration and DepEd monitoring.", "criteria": ["Generates real-time PDF and CSV reports for active enrollment counts, voucher classification distributions (QVR, ESC, ALS, Regular), and missing credential checklists."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "ATTEND", "title": "Daily attendance recording / import", "group": "Reporting", "deps": ["12", "19"], "proposed": true, "description": "Record or import daily attendance to support absence-based guidance alerts.", "story": "As a authorized school staff member, I want to use daily attendance recording / import so that record or import daily attendance to support absence-based guidance alerts.", "criteria": ["Distinguish excused and unexcused absences.", "Prevent duplicate student/date records.", "Evaluate consecutive absences using the school-day calendar."], "source": "Additional planning task \u2014 team review required."}, {"id": "RULES", "title": "Honor rules & eligibility", "group": "Reporting", "deps": [], "proposed": true, "description": "Document and configure institution-approved honor eligibility and calculation rules.", "story": "As a authorized school staff member, I want to use honor rules & eligibility so that document and configure institution-approved honor eligibility and calculation rules.", "criteria": ["Approve weights, thresholds and rounding with the school.", "Define treatment of INC, failures, missing grades and ties.", "Verify computation against approved example cases."], "source": "Additional planning task \u2014 team review required."}, {"id": "SO", "title": "Special Order capture & validation", "group": "Reporting", "deps": ["12"], "proposed": true, "description": "Capture required DepEd Special Order information and validate document eligibility.", "story": "As a authorized school staff member, I want to use special order capture & validation so that capture required DepEd Special Order information and validate document eligibility.", "criteria": ["Confirm which programs and documents require SO information.", "Prevent generation when required SO information is missing.", "Audit authorized SO corrections."], "source": "Additional planning task \u2014 team review required."}, {"id": "33", "title": "Guidance at-risk monitoring", "group": "Reporting", "deps": ["31", "24", "15", "ATTEND"], "proposed": false, "description": "Early-warning dashboard helping the Guidance Office identify students requiring academic or attendance intervention.", "story": "As a authorized school staff member, I want to use guidance at-risk monitoring so that early-warning dashboard helping the Guidance Office identify students requiring academic or attendance intervention.", "criteria": ["Filter engine flagging students based on configurable rules:", "Consecutive unexcused absences.", "Failing subject marks or unresolved INC ratings.", "Overdue mandatory credentials.", "Includes exportable case sheets and counseling status notes."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "34", "title": "Honor roll computation", "group": "Reporting", "deps": ["24", "RULES"], "proposed": false, "description": "Automated academic achievement calculation.", "story": "As a authorized school staff member, I want to use honor roll computation so that automated academic achievement calculation.", "criteria": ["Spring Boot computation service calculating General Weighted Averages (GWA) across grading terms and sorting candidates based on institutional and DepEd honor criteria."], "source": "Derived draft \u2014 review against the implementation plan."}, {"id": "35", "title": "Official documents: Form 1 function renderBoard(){if(view!=='board')return;const area=el('board');area.replaceChildren();let bar=document.createElement('div');bar.className='board-toolbar';let filter=document.createElement('select');filter.setAttribute('aria-label','Filter sprint');[['all','All tasks'],['','Backlog'],...Object.entries(sprints()).map(([id,s])=>[id,s.name+(s.start?' · '+s.start+' – '+s.end:'')])].forEach(([id,t])=>{let o=document.createElement('option');o.value=id;o.textContent=t;filter.append(o)});filter.value=sprintFilter;filter.onchange=()=>{sprintFilter=filter.value;renderBoard()};let create=document.createElement('button');create.textContent='+ Create sprint';create.onclick=()=>{let form=document.createElement('form');form.className='board-toolbar';let name=document.createElement('input');name.placeholder='Sprint name';name.required=true;name.setAttribute('aria-label','Sprint name');let start=document.createElement('input');start.type='date';start.required=true;start.setAttribute('aria-label','Start date');let end=document.createElement('input');end.type='date';end.required=true;end.setAttribute('aria-label','End date');let save=document.createElement('button');save.textContent='Create';form.append(name,start,end,save);form.onsubmit=e=>{e.preventDefault();if(end.value<start.value){end.setCustomValidity('End must be on or after start');end.reportValidity();return}savePatch('__sprints',{['sprint-'+Date.now()]:{name:name.value.trim(),start:start.value,end:end.value}})};end.oninput=()=>end.setCustomValidity('');bar.append(form)};bar.append(filter,create);area.append(bar);let hint=document.createElement('p');hint.textContent='Drag cards between columns. Choose a sprint, then drop a card to assign it. Use a task’s status and sprint selectors on touch devices.';area.append(hint);let columns=document.createElement('div');columns.className='columns';['To Do','In Progress','Review','Done'].forEach(status=>{let col=document.createElement('section');col.className='column';let h=document.createElement('h3');h.textContent=status;col.append(h);col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');col.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(!byId[id])return;savePatch(id,{status,done:status==='Done',...(sprintFilter==='all'?{}:{sprint:sprintFilter})})};DATA.nodes.filter(n=>{const t=taskState(n.id);return (t.done?'Done':t.status||'To Do')===status&&(sprintFilter==='all'||(t.sprint||'')===sprintFilter)&&(!el('group').value||n.group===el('group').value)&&(!el('search').value||(name(n.id)+' '+n.title).toLowerCase().includes(el('search').value.toLowerCase()))}).forEach(n=>{let b=document.createElement('button');b.className='task-card'+(done.has(n.id)?' complete':'');b.style.setProperty('--color',colors[n.group]);b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',n.id);b.onclick=()=>pick(n.id);let sm=document.createElement('small');const t=taskState(n.id);sm.textContent=name(n.id)+' · '+(sprints()[t.sprint]?.name||'Backlog');let strong=document.createElement('strong');strong.textContent=n.title;b.append(sm,strong);let owner=document.createElement('small');owner.className='assignee-badge';owner.textContent=t.assignee||'Unassigned';b.append(owner);const blockers=n.deps.filter(d=>!done.has(d));if(blockers.length){let p=document.createElement('small');p.textContent=blockers.length+' prerequisites unfinished';b.append(p)}col.append(b)});columns.append(col)});area.append(columns)}
