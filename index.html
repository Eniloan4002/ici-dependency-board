function applyProgress(data){done.clear();Object.entries(data.tasks||{}).forEach(([id,state])=>{if(state.done&&byId[id])done.add(id)});overlayPending();render()}
async function refreshProgress(){if(saving)return;try{const {data}=await readProgress();applyProgress(data);el('sync').textContent=''+(Object.keys(pending).length?Object.keys(pending).length+' changes saved in this browser · connect to share':'Shared progress synced · '+new Date().toLocaleTimeString())}catch(e){el('sync').textContent=e.message}}
async function saveProgress(id,value){if(!githubToken){pending[id]={done:value,updatedAt:new Date().toISOString()};const stored=storePending();overlayPending();render();el('sync').textContent=stored?'Saved in this browser · Enable shared editing to share with your team':'Changed for this session only — browser storage is unavailable';return}if(saving)return;saving=true;render();try{let saved=false;for(let attempt=0;attempt<3;attempt++){const {sha,data}=await readProgress();data.tasks??={};data.tasks[id]={done:value,updatedAt:new Date().toISOString()};const content=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(data,null,2)+'\n')));const r=await fetch(progressURL,{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({message:'Update ICI board: '+name(id)+(value?' complete':' reopened'),content,sha,branch:'main'})});if(r.status===409||r.status===422)continue;if(!r.ok)throw Error('Save failed ('+r.status+'). Check Contents write access and branch protection.');delete pending[id];storePending();applyProgress(data);saved=true;el('sync').textContent='Saved to shared repository';break}if(!saved)throw Error('Concurrent update: please try again.')}catch(e){pending[id]={done:value,updatedAt:new Date().toISOString()};storePending();overlayPending();el('sync').textContent=e.message+' Change kept locally; reconnect to retry.'}finally{saving=false;render()}}
el('connect').onclick=()=>{if(githubToken){githubToken='';el('connect').textContent='Enable shared editing';el('sync').textContent='Signed out of editing';return}const token=window.prompt('Enter a fine-grained GitHub token for this repository with Contents: read and write. It stays in this tab’s memory and is sent only to api.github.com. Never use a token on a page you do not trust.');if(token&&token.trim()){githubToken=token.trim();el('connect').textContent='Disable shared editing';(async()=>{for(const [id,state] of Object.entries({...pending}))await saveProgress(id,state.done);await refreshProgress()})()}};
overlayPending();render();refreshProgress();setInterval(refreshProgress,30000);
</script></html>
